name: Game TK NAFIL

# Script ini akan berjalan otomatis setiap ada kode baru di branch main/master
on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Apache Cordova
      run: npm install -g cordova

    - name: Game TK NAFIL
      run: |
        # Membuat project Android dasar (Package Name dan Nama Game)
        cordova create android_app com.ianvex.gametk "Game TK"
        
        # Memindahkan file web game HTML kamu ke dalam aplikasi
        rm -rf android_app/www/*
        cp -r www/* android_app/www/
        
        # Eksekusi compile APK
        cd android_app
        cordova platform add android
        cordova build android

    - name: Game TK NAFIL
      uses: actions/upload-artifact@v4
      with:
        name: Game-TK-Offline-APK
        path: android_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk

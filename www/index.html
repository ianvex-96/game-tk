<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Game TK NAFIL</title>
    <style>
        /* --- STREAMING_CHUNK:Styling layout and responsive elements... --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #f0f0f0;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            background: linear-gradient(135deg, #FFDEE9 0%, #B5FFFC 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        #app-container {
            width: 100%;
            height: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        /* --- Teks dan Menu --- */
        .school-logo {
            font-size: clamp(60px, 15vh, 120px);
            margin-top: 5vh;
            margin-bottom: 2vh;
        }

        .title-text {
            color: #FF6F61;
            font-size: clamp(24px, 5vh, 48px);
            margin-bottom: 1vh;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle-text {
            color: #008080;
            font-size: clamp(14px, 2.5vh, 22px);
            margin-bottom: 5vh;
        }

        .menu-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2.5vh;
            align-items: center;
            padding-bottom: 5vh;
            position: relative;
            flex-grow: 1;
        }

        .btn-menu {
            width: 80%;
            max-width: 350px;
            height: clamp(55px, 9vh, 90px);
            border-radius: clamp(25px, 4.5vh, 45px);
            border: none;
            color: white;
            font-size: clamp(18px, 3vh, 32px);
            font-weight: bold;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: clamp(15px, 3vh, 40px);
            cursor: pointer;
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
        }

        .btn-math { background-color: #FF6B6B; }
        .btn-color { background-color: #4ECDC4; }
        .btn-letter { background-color: #FFE66D; color: #555; }

        .btn-icon {
            font-size: clamp(20px, 4vh, 40px);
            margin-right: clamp(10px, 2.5vh, 20px);
        }

        /* --- Tambahan: Tombol Suara Ulang & Versi --- */
        .btn-speak {
            background-color: #FFA500;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        .btn-speak:active {
            transform: scale(0.95);
        }
        
        .version-info {
            position: absolute;
            bottom: 2vh;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }

        /* --- Kontainer Game --- */
        .game-view {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(5px);
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 20px;
            padding-top: 12vh;
        }

        #btn-back {
            position: absolute;
            top: 5vh;
            left: 5vw;
            padding: 10px 20px;
            font-size: clamp(14px, 2.5vh, 20px);
            background-color: #555;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            z-index: 10;
        }

        .game-title {
            font-size: clamp(24px, 4vh, 36px);
            color: #FF4500;
            margin-bottom: 2vh;
            text-align: center;
        }
        
        .game-contents > p {
            font-size: clamp(16px, 2.5vh, 24px);
            text-align: center;
            margin-bottom: 10px;
        }

        .game-contents {
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .fruit-display {
            font-size: clamp(40px, 8vh, 80px);
            margin: 2vh 0;
            min-height: 10vh;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .options-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 2vh;
        }

        .btn-option {
            background-color: #32CD32;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: clamp(24px, 4vh, 40px);
            font-weight: bold;
            width: clamp(60px, 10vh, 90px);
            height: clamp(60px, 10vh, 90px);
            cursor: pointer;
            box-shadow: 0 6px 0 #228B22;
        }
        
        .btn-option:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 #228B22;
        }

        .feedback {
            font-size: clamp(18px, 3vh, 28px);
            font-weight: bold;
            min-height: 4vh;
            margin-top: 5vh; /* Ruang lega untuk teks benar/salah */
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <div class="school-logo">🏫</div>
        <h1 class="title-text">Game TK NAFIL</h1>
        <p class="subtitle-text">Belajar, Bermain, Bergembira!</p>

        <div id="main-menu" class="menu-container">
            <button class="btn-menu btn-math" onclick="openGame('math')">
                <span class="btn-icon">🔢</span> Ayo Berhitung
            </button>
            <button class="btn-menu btn-color" onclick="openGame('color')">
                <span class="btn-icon">🎨</span> Tebak Warna
            </button>
            <button class="btn-menu btn-letter" onclick="openGame('letter')">
                <span class="btn-icon">abc</span> Tebak Huruf
            </button>
            <!-- Auto Versioning dari GitHub Actions -->
            <div class="version-info">Versi 1.0.0</div> 
        </div>

        <button id="btn-back" onclick="backToMenu()" style="display: none;">⬅️ Kembali</button>

        <div id="game-math" class="game-view">
            <h2 class="game-title">Ayo Berhitung!</h2>
            <div class="game-contents">
                <p>Ada berapa buah apel di bawah ini?</p>
                <button class="btn-speak" onclick="speak('Ayo berhitung! Ada berapa buah apel di bawah ini?')">🔊 Ulangi Suara</button>
                <div id="fruitDisplay" class="fruit-display"></div>
                <div id="math-options" class="options-container"></div>
                <div id="feedback-math" class="feedback"></div>
            </div>
        </div>

        <div id="game-color" class="game-view">
            <h2 class="game-title">Tebak Warna!</h2>
            <div class="game-contents">
                <p id="question-color"></p>
                <button class="btn-speak" onclick="replayColorAudio()">🔊 Ulangi Suara</button>
                <div id="color-options" class="options-container"></div>
                <div id="feedback-color" class="feedback"></div>
            </div>
        </div>

        <div id="game-letter" class="game-view">
            <h2 class="game-title">Tebak Huruf!</h2>
            <div class="game-contents">
                <p id="question-letter"></p>
                <button class="btn-speak" onclick="replayLetterAudio()">🔊 Ulangi Suara</button>
                <div id="letter-options" class="options-container"></div>
                <div id="feedback-letter" class="feedback"></div>
            </div>
        </div>
    </div>

    <script>
        /* --- STREAMING_CHUNK:Initializing audio and speech synthesis logic... --- */
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                let now = audioCtx.currentTime;
                if (type === 'correct') {
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.setValueAtTime(660, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } else if (type === 'wrong') {
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(150, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch(e) {}
        }

        let ttsUnlocked = false;

        function unlockAudio() {
            if (!ttsUnlocked && 'speechSynthesis' in window) {
                let silentUtterance = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(silentUtterance);
                ttsUnlocked = true;
            }
        }
        document.addEventListener('touchstart', unlockAudio, { once: true });
        document.addEventListener('click', unlockAudio, { once: true });

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.pitch = 1.2;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        function replayColorAudio() {
            if (currentColorData) speak(`Mana yang warna ${currentColorData.name}?`);
        }

        function replayLetterAudio() {
            if (currentLetterData) speak(`Huruf ${currentLetterData.letter} untuk apa?`);
        }

        /* --- STREAMING_CHUNK:Defining navigation and game event handlers... --- */
        function openGame(gameType) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('btn-back').style.display = 'block';

            const views = document.querySelectorAll('.game-view');
            views.forEach(v => v.style.display = 'none');

            const selectedGame = document.getElementById(`game-${gameType}`);
            if (selectedGame) {
                selectedGame.style.display = 'flex';
                
                if (gameType === 'math') {
                    startGameMath();
                    speak("Ayo berhitung! Ada berapa buah apel di bawah ini?");
                } else if (gameType === 'color') {
                    startGameColor();
                } else if (gameType === 'letter') {
                    startGameLetter();
                }
            }
        }

        function backToMenu() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('btn-back').style.display = 'none';
            
            const views = document.querySelectorAll('.game-view');
            views.forEach(v => v.style.display = 'none');
            
            document.getElementById('main-menu').style.display = 'flex';
        }

        /* === Game 1: Ayo Berhitung === */
        let currentAnswerMath = 0;
        const feedbackMath = document.getElementById('feedback-math');

        function startGameMath() {
            feedbackMath.innerText = "";
            const fruitDisplay = document.getElementById('fruitDisplay');
            const optionsContainer = document.getElementById('math-options');
            
            currentAnswerMath = Math.floor(Math.random() * 5) + 1;
            
            let fruitsHTML = '';
            for(let i = 0; i < currentAnswerMath; i++) { fruitsHTML += '🍎'; }
            fruitDisplay.innerHTML = fruitsHTML;

            let options = [currentAnswerMath];
            while(options.length < 3) {
                let wrongAnswer = Math.floor(Math.random() * 5) + 1;
                if(!options.includes(wrongAnswer)) options.push(wrongAnswer);
            }
            options.sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = '';
            options.forEach(num => {
                let btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.innerText = num;
                btn.onclick = () => checkAnswerMath(num);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswerMath(selectedNumber) {
            if(selectedNumber === currentAnswerMath) {
                playSound('correct');
                feedbackMath.style.color = "#32CD32";
                feedbackMath.innerText = "Hore! Benar Sekali! 🎉";
                speak(`Benar! Ada ${selectedNumber} apel!`);
                setTimeout(startGameMath, 3000);
            } else {
                playSound('wrong');
                feedbackMath.style.color = "#FF0000";
                feedbackMath.innerText = "Yah, coba lagi ya! 🤔";
                speak("Yah, coba lagi!");
            }
        }

        /* === Game 2: Tebak Warna === */
        const colorsData = [
            { name: "Merah", code: "#FF0000", emoji: "❤️" },
            { name: "Biru", code: "#0000FF", emoji: "💙" },
            { name: "Hijau", code: "#008000", emoji: "💚" },
            { name: "Kuning", code: "#FFFF00", emoji: "💛" },
            { name: "Ungu", code: "#800080", emoji: "💜" }
        ];
        let currentColorData = null;
        const feedbackColor = document.getElementById('feedback-color');
        const questionColorT = document.getElementById('question-color');

        function startGameColor() {
            feedbackColor.innerText = "";
            const optionsContainer = document.getElementById('color-options');
            currentColorData = colorsData[Math.floor(Math.random() * colorsData.length)];
            
            questionColorT.innerHTML = `Mana yang warna <span style="font-weight:bold; color:${currentColorData.code}">${currentColorData.name}</span>? ${currentColorData.emoji}`;
            
            speak(`Mana yang warna ${currentColorData.name}?`);

            let wrongColors = colorsData.filter(c => c.name !== currentColorData.name);
            wrongColors.sort(() => Math.random() - 0.5);
            let options = [currentColorData, wrongColors[0], wrongColors[1]];
            options.sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = '';
            optionsContainer.style.gap = "clamp(10px, 3vh, 30px)";
            
            options.forEach(colorItem => {
                let btn = document.createElement('div');
                btn.style.width = "clamp(60px, 12vh, 120px)";
                btn.style.height = "clamp(60px, 12vh, 120px)";
                btn.style.backgroundColor = colorItem.code;
                btn.style.borderRadius = "clamp(10px, 2vh, 20px)";
                btn.style.cursor = "pointer";
                btn.style.boxShadow = "0 4px 6px rgba(0,0,0,0.2)";
                btn.onclick = () => checkAnswerColor(colorItem);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswerColor(selectedColor) {
            if(selectedColor.name === currentColorData.name) {
                playSound('correct');
                feedbackColor.style.color = "#32CD32";
                feedbackColor.innerText = `Benar! Ini ${currentColorData.name}! 🎉`;
                speak(`Ya! Ini ${currentColorData.name}!`);
                setTimeout(startGameColor, 2500); 
            } else {
                playSound('wrong');
                feedbackColor.style.color = "#FF0000";
                feedbackColor.innerText = `Bukan! Coba lagi! 🤔`;
                speak("Bukan! Coba lagi!");
            }
        }

        /* === Game 3: Tebak Huruf === */
        const lettersData = [
            { letter: "A", word: "Apel", emoji: "🍎" },
            { letter: "B", word: "Bola", emoji: "⚽" },
            { letter: "C", word: "Cicak", emoji: "🦎" },
            { letter: "D", word: "Domba", emoji: "🐑" },
            { letter: "E", word: "Es Krim", emoji: "🍦" }
        ];
        let currentLetterData = null;
        const feedbackLetter = document.getElementById('feedback-letter');
        const questionLetterT = document.getElementById('question-letter');

        function startGameLetter() {
            feedbackLetter.innerText = "";
            const optionsContainer = document.getElementById('letter-options');
            currentLetterData = lettersData[Math.floor(Math.random() * lettersData.length)];
            
            questionLetterT.innerHTML = `Huruf <span style="font-weight:bold; font-size:36px; color:#FF4500">${currentLetterData.letter}</span> untuk apa?`;
            
            speak(`Huruf ${currentLetterData.letter} untuk apa?`);

            let wrongLetters = lettersData.filter(l => l.letter !== currentLetterData.letter);
            wrongLetters.sort(() => Math.random() - 0.5);
            let options = [currentLetterData, wrongLetters[0], wrongLetters[1]];
            options.sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = '';
            options.forEach(letterItem => {
                let btn = document.createElement('button');
                btn.className = 'btn-option';
                btn.style.fontSize = "clamp(30px, 6vh, 60px)";
                btn.style.width = "clamp(70px, 12vh, 120px)";
                btn.style.height = "clamp(70px, 12vh, 120px)";
                btn.innerHTML = letterItem.emoji;
                btn.onclick = () => checkAnswerLetter(letterItem);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswerLetter(selectedLetterItem) {
            if(selectedLetterItem.letter === currentLetterData.letter) {
                playSound('correct');
                feedbackLetter.style.color = "#32CD32";
                feedbackLetter.innerText = `Benar! ${currentLetterData.letter} untuk ${currentLetterData.word}! 🎉`;
                speak(`Ya! ${currentLiteral = currentLetterData.letter} untuk ${currentLetterData.word}!`);
                setTimeout(startGameLetter, 3000);
            } else {
                playSound('wrong');
                feedbackLetter.style.color = "#FF0000";
                feedbackLetter.innerText = "Yah, salah! Coba lagi! 🤔";
                speak("Yah, salah! Coba lagi!");
            }
        }
    </script>
</body>
</html>
